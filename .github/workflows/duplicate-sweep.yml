# A duplicate issue or pull request gets one warning, then closes if the author
# does not show it is not a duplicate within seven days.
#
# "Show it is not a duplicate" means: the description was edited, or the author
# replied and a maintainer removed the label. If neither happens, the item
# closes. Removing the label at any point cancels the close, because the script
# re-reads the label on every run.
#
# Issues are labelled `duplicate`; PRs are labelled `duplicate-pr` (a PR must
# never carry the issue-lifecycle `duplicate` label). The triage automation
# applies the label and links the original. This only enforces the consequence.
name: Duplicate sweep

on:
  schedule:
    - cron: '30 1 * * *'   # 08:30 Asia/Jakarta, daily
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: duplicate-sweep
  cancel-in-progress: false

jobs:
  sweep:
    name: Sweep duplicates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Warn and close stale duplicates (issues and PRs)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          GRACE_DAYS: '7'
        run: sh .github/scripts/duplicate-sweep.sh
