# Checks for PR descriptions.
#
#   template job -> HARD gate: fails while the PR template is incomplete, no
#                   issue is linked, a linked number is not an open
#                   `ready`/`bot-implement` issue, or the prose
#                   reads as English (see docs/LABELS.md); the `## HUMAN` note
#                   is required only on a risky PR (pr-template-guard.sh)
#   visual job   -> advisory: asks for before/after visuals when apps/web changed
#
# Runs on `pull_request_target` so the token can comment even on a fork PR;
# neither job checks out or runs any code from the PR, so that is safe here.
#
# The rules live in .github/scripts/ so they can be run by hand.
name: PR description checks

on:
  pull_request_target:
    # labeled/unlabeled: a `security` label makes the human note required, so
    # adding or removing it must re-run the check.
    types: [opened, edited, reopened, synchronize, ready_for_review, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: pr-description-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  template:
    name: PR template reminder
    # Dependabot writes its own body and cannot follow the template or link an
    # issue; its advisory or release notes are the record. Keyed on the PR's
    # author, which never changes, not on github.actor, which is whoever pushed
    # last (a person updating the branch would otherwise lose the exemption, or
    # a bot pushing to a person's PR would gain it). A job skipped by `if`
    # reports success, so the check can be required without blocking Dependabot.
    # Only Dependabot: upstream OpenHands skips every bot (`user.type`), but an
    # app account opening a PR here must still link its issue.
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Check the description against the template
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          # A closing keyword works only on a PR into the default branch.
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: sh .github/scripts/pr-template-guard.sh "$PR"

  visual:
    name: Before/after visual reminder
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Check for before/after visuals on a UI change
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: sh .github/scripts/visual-evidence.sh "$PR"
