# Acknowledge a request so the person can see an automation picked it up.
#
# A maintainer who comments `@openhands …` on an issue or pull request, or who
# answers a `needs-info` / `pending-maintainer` issue, otherwise has no signal
# that anything is happening until the bot answers minutes later. Reacting 👀 on
# that comment says "the automation is looking at this" (asked 2026-10-13). The
# bot's own comments are skipped, so a reply never acknowledges itself.
#
# It reacts only when a comment-triggered automation will actually run — `Bot
# sebutan` (an `@openhands` mention) or `Penjernih issue` / `Diskusi` (a
# maintainer answering a `needs-info` / `pending-maintainer` issue) — so an
# ordinary comment thread is not spammed. The automations react on the objects
# they work on themselves; this covers the comment trigger, which only the
# webhook sees.
#
# The reaction itself is .github/scripts/reaction.sh.
name: Acknowledge

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: acknowledge-${{ github.event.comment.id }}
  cancel-in-progress: false

jobs:
  react:
    name: React to a request the fleet will handle
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: React eyes when a comment-triggered automation will run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: sh .github/scripts/acknowledge.sh --stdin < "$GITHUB_EVENT_PATH"

