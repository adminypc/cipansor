# CI Workflow for Cipansor
# Lint, build, test, and security-scan on pull requests and pushes to main.
# There is no deploy stage here, and no image build: the Docker images are
# built once, by deploy-staging.yml, after both this workflow and E2E Tests
# pass on main. (A "Docker Build" job here used to build both images a second
# time on every push to main and threw them away — 13 of CI's 19 minutes.)

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default; jobs opt into more where needed.
permissions:
  contents: read

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '12.11.2'

jobs:
  # Does this change touch code at all? A change to documentation or agent
  # tooling only (`*.md`, `docs/`, `.claude/` …; the list and its exceptions
  # live in .github/scripts/change-scope.sh) cannot change what lint, the
  # builds, the tests or the dependency audit report, so they are skipped
  # (Security still runs its Markdown scan — see that job).
  # Build and Tests need Lint, so they are skipped with it. A job skipped by
  # its `if:` reports success, which satisfies the required checks; a `paths:`
  # filter on the trigger would leave them pending instead.
  scope:
    name: CI scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          case "$GITHUB_EVENT_NAME" in
            pull_request) sh .github/scripts/change-scope.sh pr "$PR" ;;
            push) sh .github/scripts/change-scope.sh since-pass ci.yml ;;
            *) echo "run=true" >> "$GITHUB_OUTPUT"; echo "scope: $GITHUB_EVENT_NAME always runs" ;;
          esac

  # Lint (build the shared package first so its types resolve).
  lint:
    name: Lint
    needs: scope
    if: needs.scope.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      # Every .ts/.tsx file is kept in Prettier's format (the repo was
      # normalised in one commit, listed in .git-blame-ignore-revs). Checked
      # first because it is the cheapest failure: the fix is `pnpm format`.
      # Agents are stopped before this: .claude/hooks/format-before-push.sh
      # refuses a push with unformatted files.
      - name: Check formatting
        run: |
          pnpm format:check || {
            echo "::error title=Unformatted files::Run \`pnpm format\` and commit the result (the [warn] lines above list the files)."
            exit 1
          }
      - run: pnpm --filter api db:generate
      - run: pnpm --filter @cipansor/shared build
      - name: Lint API
        run: pnpm --filter api lint
      - name: Lint Web
        run: pnpm --filter web lint

      # The main web tsconfig excludes e2e/**, so the Playwright specs were
      # never typechecked anywhere: an identifier that was used but never
      # declared only failed at runtime, minutes into the E2E job. This catches
      # it here in seconds instead.
      - name: Typecheck E2E specs
        run: pnpm --filter web typecheck:e2e

  # Build all packages (this also type-checks: api via tsc, web via next build).
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter api db:generate
      - run: pnpm --filter @cipansor/shared build
      - name: Build API
        run: pnpm --filter api build
        env:
          # tsc on the full API surface exceeds Node's ~2GB default heap and
          # OOMs (exit 134); raise the limit (runners have plenty of RAM).
          NODE_OPTIONS: --max-old-space-size=4096
      - name: Strict type-check API (incl. tests)
        # `build` uses the lenient tsconfig.build.json (excludes test files);
        # this runs plain `tsc` over the whole source + test tree so strict
        # type errors — the 104 just cleared — can never silently regress.
        run: pnpm --filter api build:strict
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      - name: Build Web
        run: pnpm --filter web build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001
          NODE_OPTIONS: --max-old-space-size=4096

  # Unit/integration tests, including the DB-backed suite (RUN_DB_TESTS=1).
  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cipansor_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: test-jwt-secret-key-for-ci
      RUN_DB_TESTS: '1'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: cipansor_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter api db:generate
      - name: Push database schema
        run: pnpm --filter api db:push
      - name: Run API tests with coverage
        run: pnpm --filter api test:coverage
      # The floor is a ratchet: fail when coverage dropped more than
      # `tolerance_pct` below .github/coverage-baseline.json. Reads the
      # json-summary vitest wrote in the step above; see docs/COVERAGE.md.
      - name: Check coverage floor
        run: node .github/scripts/coverage-gate.mjs
      # The web unit suite (~100 vitest specs, incl. the dead-link and RBAC
      # guards) ran in no workflow at all, so a web regression could only be
      # caught by a human running it locally. It needs the shared package's
      # built types but not the database.
      - run: pnpm --filter @cipansor/shared build
      - name: Run Web tests
        run: pnpm --filter web test
      # The load-test runner and its comparison policy are plain Node — no k6,
      # no network — so their unit suite runs here. The load test itself only
      # runs on demand (load-tests.yml), which needs a real target.
      - name: Run load-test runner unit tests
        run: node --test tests/load/run-load-tests.test.mjs

  # Supply-chain / dependency security, plus the records check.
  #
  # Unlike the other jobs this one runs on every change: project memory and the
  # docs are exactly what a no-code PR carries, and the repository is public
  # until release. The Markdown scan always runs (seconds, no install); the
  # dependency audit only when code changed. Security is a required check, so
  # a finding blocks the merge.
  security:
    name: Security
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # Keys, tokens, credentials in connection strings, cloud resource names,
      # IP addresses, host paths — AGENTS.md → "Where things live".
      - name: No sensitive detail in the repository's Markdown
        run: |
          python3 .github/scripts/check-sensitive.py --self-test
          python3 .github/scripts/check-sensitive.py $(git ls-files '*.md') .claude/memory > findings.txt || {
            sed -E 's/^([^:]+):([0-9]+): (.*)$/::error file=\1,line=\2::\3 — keep it in the machine-local memory, or use a placeholder/' findings.txt
            exit 1
          }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: needs.scope.outputs.run == 'true'
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        if: needs.scope.outputs.run == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
        if: needs.scope.outputs.run == 'true'
      # Fail the build on known high/critical advisories in the dependency tree.
      # (actions/dependency-review-action + CodeQL would add PR-diff scanning and
      # SAST, but both require GitHub Advanced Security, which isn't enabled on
      # this repo — this audit + Dependabot are the working equivalents here.)
      # NOTE: `pnpm audit` (through 11.x) still calls npm's retired audit
      # endpoint and dies with HTTP 410, so we query the bulk advisory
      # endpoint directly — see scripts/audit-deps.mjs.
      - name: Audit dependencies
        if: needs.scope.outputs.run == 'true'
        run: pnpm run audit:deps
