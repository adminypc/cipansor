# Build the release images once and put them on staging.
#
# Runs after a push to main has passed BOTH CI and E2E Tests (never for pull
# requests, never for a run that failed). It is triggered by E2E Tests — the
# slower of the two — and the `gate` job then confirms CI passed on the same
# commit. Until 2026-09-24 it was triggered by CI alone, so a commit whose E2E
# suite failed still reached staging (and could be released: production
# accepts any SHA whose images are in the registry).
#
# The three images are tagged with the commit SHA and pushed to Azure Container
# Registry; production later runs these exact images (deploy-production.yml),
# so what reaches wali is what staging tested — and an image in the registry
# now also means its commit passed CI and E2E.
#
# Signs in to Azure with OIDC — no stored Azure password. The federated
# credential only trusts jobs running in this repository's `staging`
# environment, and that identity can push images and update the staging app,
# nothing else.
name: Deploy staging

on:
  workflow_run:
    workflows: [E2E Tests]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  actions: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  ACR: cipansoracr
  RESOURCE_GROUP: cipansor-prod
  APP: cipansor-staging
  URL: https://staging.cipansor.or.id
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  # Both workflows must have passed on this commit's push to main. Also guards
  # a manual run, which would otherwise deploy whatever main points at. E2E is
  # usually the one that finishes last (about 17 minutes against CI's 6), so CI
  # is normally done; if it is still running, wait for it rather than guess.
  gate:
    name: CI and E2E passed on ${{ github.event.workflow_run.head_sha || github.sha }}
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      deploy: ${{ steps.scope.outputs.deploy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false

      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for wf in ci.yml e2e-tests.yml; do
            for _ in $(seq 1 40); do
              read -r status conclusion < <(gh api \
                "repos/$GITHUB_REPOSITORY/actions/workflows/$wf/runs?head_sha=$SHA&event=push&per_page=1" \
                --jq '.workflow_runs[0] // {} | "\(.status // "missing") \(.conclusion // "-")"')
              [ "$status" = "completed" ] && break
              echo "$wf on $SHA: $status — waiting"
              sleep 30
            done
            echo "$wf on $SHA: $status / $conclusion"
            if [ "$status" != "completed" ] || [ "$conclusion" != "success" ]; then
              echo "::error::$wf has not passed on $SHA ($status / $conclusion) — staging keeps its current release"
              exit 1
            fi
          done

      # Nothing to rebuild when no code changed since the commit staging runs:
      # a documentation-only merge would otherwise cost three image builds and
      # a restart that serve the same bytes. Staging then keeps reporting that
      # earlier commit, and that commit is what a release takes (production
      # releases the SHA staging runs). A manual run always deploys.
      - id: scope
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"; echo "scope: manual run always deploys"; exit 0
          fi
          current=$(curl -s --max-time 15 -H 'Cache-Control: no-cache' "$URL/healthz" | jq -r '.commit // empty' 2>/dev/null || true)
          if [ -z "$current" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"; echo "scope: staging did not report its commit — deploying"; exit 0
          fi
          echo "staging runs $current"
          SCOPE_KEY=deploy sh .github/scripts/change-scope.sh between "$current" "$SHA"

  build:
    name: Build ${{ matrix.image }}
    needs: gate
    if: needs.gate.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment: staging
    strategy:
      fail-fast: true
      matrix:
        include:
          - image: api
            context: .
            file: apps/api/Dockerfile
          - image: web
            context: .
            file: apps/web/Dockerfile
          - image: nginx
            context: deploy/azure/nginx
            file: deploy/azure/nginx/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.SHA }}

      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - run: az acr login --name "$ACR"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # NEXT_PUBLIC_* are baked into the web bundle at build time. The API base
      # is deliberately empty (same-origin through nginx), which is what lets
      # one web image serve both staging and production. The Turnstile site key
      # is public by design; its widget lists both hosts.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ env.ACR }}.azurecr.io/cipansor-${{ matrix.image }}:${{ env.SHA }}
          # GIT_COMMIT_SHA is reported by the api's /health; the deploy job
          # waits for it (only the api image uses it).
          build-args: |
            GIT_COMMIT_SHA=${{ env.SHA }}
            NEXT_PUBLIC_API_URL=
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ vars.TURNSTILE_SITE_KEY }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploy:
    name: Update staging
    needs: build
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.SHA }}
          sparse-checkout: deploy/azure

      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Everything the release needs is checked BEFORE the first image is
      # pointed at the new SHA. Azure keeps container image settings even when
      # a later step fails, so a check placed after the image loop can fail the
      # release while leaving staging aimed at an unverified build — a restart
      # would then activate it. Keeping the image config untouched on a bad
      # release is the point of validating here.
      - name: Validate the staging settings
        run: |
          # All THREE chatbot settings are required together: `resolveProvider()`
          # needs key, base URL and model, and returns null (assistant off) if
          # any one is missing. Testing only the key let
          # `CHATBOT_PROVIDER=openai-compatible` be written with an empty base
          # URL or model, which deployed successfully but left the assistant
          # invisible. When the key is set the other two are REQUIRED; unset the
          # key to keep the assistant deliberately off.
          if [ -n "$CHATBOT_API_KEY" ] && { [ -z "$CHATBOT_API_BASE_URL" ] || [ -z "$CHATBOT_MODEL" ]; }; then
            echo "::error::CHATBOT_API_KEY is set for staging, so CHATBOT_API_BASE_URL and CHATBOT_MODEL are required too — an assistant configured halfway comes up invisible. Set both variables, or unset the key to keep the assistant deliberately off."
            exit 1
          fi
        env:
          CHATBOT_API_KEY: ${{ secrets.CHATBOT_API_KEY }}
          CHATBOT_API_BASE_URL: ${{ vars.CHATBOT_API_BASE_URL }}
          CHATBOT_MODEL: ${{ vars.CHATBOT_MODEL }}

      - name: Point the staging containers at ${{ env.SHA }}
        run: |
          # --target-port every time: `az webapp sitecontainers update` (CLI
          # 2.90) writes whatever --target-port holds, so omitting it would
          # erase the port and App Service could no longer reach nginx.
          declare -A port=([api]=3001 [web]=3000 [nginx]=80)
          for c in api web nginx; do
            az webapp sitecontainers update -g "$RESOURCE_GROUP" -n "$APP" \
              --container-name "$c" --image "$ACR.azurecr.io/cipansor-$c:$SHA" \
              --target-port "${port[$c]}" -o none
          done
          # Every document staging renders is a test copy, stamped "SALINAN UJI —
          # BUKAN DOKUMEN SAH" (config.documents.testCopy). Set on every release
          # so a rebuilt app cannot come up without it; production never sets it.
          #
          # APP_ENV=staging is the deployed-copy identity, distinct from NODE_ENV
          # (`production` on both copies because both run the same images). It is
          # what /health reports as `environment`, and what lets a guard say "not
          # in production" and mean it.
          #
          # The chatbot runs the REAL provider here, with staging's own key, so a
          # walkthrough answers the way production answers. When the key is not
          # configured the assistant stays off rather than falling back to a
          # deterministic double: a stub that answers like a model is the one
          # thing staging must never show a reviewer.
          #
          # The three chatbot settings are ASSEMBLED here; whether they are
          # COMPLETE was decided before any image moved (see "Validate the
          # staging settings"). A half-configured assistant comes up invisible,
          # which is the exact failure this PR exists to fix.
          settings=(DOCUMENT_TEST_COPY=true APP_ENV=staging)
          if [ -n "$CHATBOT_API_KEY" ]; then
            settings+=(
              CHATBOT_PROVIDER=openai-compatible
              CHATBOT_API_BASE_URL="$CHATBOT_API_BASE_URL"
              CHATBOT_API_KEY="$CHATBOT_API_KEY"
              CHATBOT_MODEL="$CHATBOT_MODEL"
            )
          else
            echo "::warning::CHATBOT_API_KEY is not set for the staging environment; the assistant stays disabled there"
            settings+=(CHATBOT_PROVIDER=disabled)
          fi
          az webapp config appsettings set -g "$RESOURCE_GROUP" -n "$APP" \
            --settings "${settings[@]}" -o none
          # Web Push: this environment's own VAPID pair (decisions/
          # notifikasi-push.md), from the environment's secret and variable.
          # Absent = push stays off, so nothing here forces a pair on anyone.
          # -o none: the command would otherwise echo the settings back.
          if [ -n "$VAPID_PRIVATE_KEY" ] && [ -n "$VAPID_PUBLIC_KEY" ]; then
            az webapp config appsettings set -g "$RESOURCE_GROUP" -n "$APP" \
              --settings VAPID_PUBLIC_KEY="$VAPID_PUBLIC_KEY" \
              VAPID_PRIVATE_KEY="$VAPID_PRIVATE_KEY" \
              VAPID_SUBJECT=mailto:halo@cipansor.or.id -o none
          fi
          az webapp restart -g "$RESOURCE_GROUP" -n "$APP"
        env:
          VAPID_PUBLIC_KEY: ${{ vars.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          CHATBOT_API_KEY: ${{ secrets.CHATBOT_API_KEY }}
          CHATBOT_API_BASE_URL: ${{ vars.CHATBOT_API_BASE_URL }}
          CHATBOT_MODEL: ${{ vars.CHATBOT_MODEL }}

      # The api container applies pending migrations before it starts
      # (MIGRATE_ON_START=true on staging), so a migration that fails shows up
      # here as a release that never answers — on staging, before any release
      # to production.
      - name: Wait until ${{ env.SHA }} answers at ${{ env.URL }}
        run: bash deploy/azure/wait-for-release.sh "$URL" "$SHA"
