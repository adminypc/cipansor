# Post the CI result and dispatch the review gate.
#
# Triggered by workflow_run so it sees the finished result of every workflow on
# the PR's head. It never changes the draft/ready state and never approves or
# merges.
#
#   green CI + draft PR              -> post the all-green comment, leave the
#                                       draft decision to a human
#   green CI + ready PR              -> dispatch the review gate (`Gerbang tinjau PR`)
#   red CI                           -> quiet (checks are visible on the PR)
#   changes requested on the current head -> quiet (waiting for fixes)
#   changes requested on an older commit + green head -> dispatch the gate again
#
# `pull_request_review` is also subscribed so a changes-requested review
# submitted after CI finished is seen. A request on the current head is quiet;
# once the author pushes a new head and it goes green, the gate is dispatched
# again to review that head (#727).
#
# `pull_request`/`ready_for_review` is subscribed because a documentation-only
# PR never produces a `workflow_run` completion after it turns ready: its scope
# job skips Lint, Build, Tests and E2E, so CI finishes while the PR is still a
# draft, and the ready transition (the moment the gate should run) fires no
# event the `workflow_run` subscription can see. Without it a ready docs PR is
# never reviewed.
#
# The rules live in .github/scripts/pr-lifecycle.sh so they can be run by hand.
name: PR lifecycle

on:
  workflow_run:
    workflows: [CI, E2E Tests]
    types: [completed]
  pull_request_review:
    types: [submitted, dismissed]
  pull_request:
    types: [ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: read
  actions: read

concurrency:
  group: pr-lifecycle-${{ github.event.workflow_run.pull_requests[0].number || github.event.pull_request.number || github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  lifecycle:
    # Only for PR runs. A push to main has no pull request to act on.
    if: |
      (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.pull_requests[0].number != null) ||
      (github.event_name == 'pull_request_review' && github.event.pull_request.number != null) ||
      (github.event_name == 'pull_request' && github.event.pull_request.number != null)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Apply lifecycle rules
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.workflow_run.pull_requests[0].number || github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha }}
          OPENHANDS_API_KEY: ${{ secrets.OPENHANDS_API_KEY }}
        run: sh .github/scripts/pr-lifecycle.sh "$PR" "$HEAD_SHA"
