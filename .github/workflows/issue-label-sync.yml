# Keep a pull request's labels in sync with the issue it closes, and fail the
# check when they disagree.
#
# The taxonomy and the rules live in .github/scripts/issue-label-sync.sh so the
# same logic can be run by hand. The check is advisory in name only: add
# "Issue label sync" to the branch protection required checks to make it
# blocking. It reports success (not pending) when there is nothing to compare,
# so it never wedges a PR that closes no issue.
name: Issue label sync

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, labeled, unlabeled, ready_for_review]
  # Relabelling a linked issue fires no pull_request event, so the PR keeps its
  # old labels and its previous (passing) sync check. Re-sync every open PR that
  # closes the issue when the issue changes.
  issues:
    types: [labeled, unlabeled, edited]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: write

concurrency:
  group: issue-label-sync-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  sync:
    name: Issue label sync
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Check labels (pull request)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: sh .github/scripts/issue-label-sync.sh "$PR"
      # On a fork PR the `pull_request` event hands out a read-only token, so
      # `gh pr edit` cannot copy a label. Verify the labels and report the
      # difference; when they differ the check fails (naming the labels) rather
      # than passing on a mislabeled PR. A maintainer applies them.
      - name: Verify labels only (fork pull request)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          READ_ONLY: '1'
        run: sh .github/scripts/issue-label-sync.sh "$PR"
      - name: Re-sync PRs that close the issue
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
        run: sh .github/scripts/issue-label-sync.sh --issue "$ISSUE"
