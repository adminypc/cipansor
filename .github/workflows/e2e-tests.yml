name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # ready_for_review: a draft skips the suite (see `scope`), so marking it
    # ready has to start a run that does not.
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch: # Allow manual trigger

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '12.11.2'

jobs:
  # Does this run need the suite at all? It is most of the pipeline's
  # minutes, and two kinds of change gain nothing from it: a DRAFT pull request
  # (still being pushed to; the suite runs when it is marked ready) and a
  # change with no code in it — documentation or agent tooling only, as
  # .github/scripts/change-scope.sh defines it (shared with CI and the staging
  # deploy). A push to main is measured against the last commit on which this
  # workflow passed, not its parent, so a run cancelled by a newer commit is
  # never silently skipped.
  #
  # Skipping is done with a job-level `if:` on purpose. A job skipped by its
  # condition reports success, so the required check "E2E Tests (Chromium)"
  # is satisfied; a `paths:` filter on the trigger would skip the whole
  # workflow instead and leave that required check pending forever.
  scope:
    name: E2E scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          DRAFT: ${{ github.event.pull_request.draft }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          case "$GITHUB_EVENT_NAME" in
            pull_request)
              if [ "$DRAFT" = "true" ]; then
                echo "run=false" >> "$GITHUB_OUTPUT"
                echo "scope: run=false — draft pull request; runs when marked ready"
              else
                sh .github/scripts/change-scope.sh pr "$PR"
              fi ;;
            push) sh .github/scripts/change-scope.sh since-pass e2e-tests.yml ;;
            *) echo "run=true" >> "$GITHUB_OUTPUT"; echo "scope: $GITHUB_EVENT_NAME always runs" ;;
          esac

  # Primary gate: the full Playwright suite on Chromium against a real,
  # seeded backend (the app's primary target browser).
  e2e:
    name: E2E Tests (Chromium)
    needs: scope
    if: needs.scope.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      pull-requests: write # for the report comment on PRs

    # The API reads these from the shell (its dotenv path is build-relative and
    # unreliable), so we set them job-wide rather than via a .env file.
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cipansor_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: test-jwt-secret-key-for-e2e-testing
      # Production default is 15m; e2e pins 7d because global-setup logs each
      # role in ONCE and reuses the tokens for the whole (up to 40-min) run.
      JWT_EXPIRES_IN: 7d
      JWT_REFRESH_EXPIRES_IN: 30d
      CORS_ORIGIN: http://localhost:3000
      PORT: '3001'
      LOG_LEVEL: error
      # The e2e auth helper signs admin TOTPs from a known secret seeded when
      # E2E_FIXED_2FA=1; raise the 2FA limiter so the many logins don't trip it.
      TWO_FACTOR_RATE_LIMIT_MAX: '100000'
      # Same reason for the e-sign limiter: a spec that signs several letters
      # in one run would otherwise hit a cap meant to slow down guessing.
      ESIGN_RATE_LIMIT_MAX: '100000'
      # Baked into the web build: API base origin only (the app appends /api).
      NEXT_PUBLIC_API_URL: http://localhost:3001
      # Used by the e2e test runner, which builds full paths — keep the /api.
      API_URL: http://localhost:3001/api
      BASE_URL: http://localhost:3000

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: cipansor_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright (Chromium)
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Generate Prisma client
        run: pnpm --filter api db:generate

      - name: Push database schema
        run: pnpm --filter api db:push

      - name: Seed database (with fixed-secret 2FA for admins)
        run: pnpm --filter api db:seed
        env:
          E2E_FIXED_2FA: '1'
          ALLOW_DESTRUCTIVE_SEED: '1'

      - name: Build shared + API + Web
        run: |
          pnpm --filter @cipansor/shared build
          pnpm --filter api build
          pnpm --filter web build
        env:
          # tsc on the full API surface exceeds Node's ~2GB default heap and
          # OOMs (exit 134); raise the limit (runners have plenty of RAM).
          NODE_OPTIONS: --max-old-space-size=4096

      # Web Push needs a VAPID key pair on the API, or the settings card reports
      # push unavailable and the subscribe/disable e2e cannot run. A pair made
      # for this job and thrown away with it — never a stored secret.
      - name: Generate a throwaway VAPID key pair
        run: |
          node -e "const c=require('crypto').createECDH('prime256v1');c.generateKeys();console.log('VAPID_PUBLIC_KEY='+c.getPublicKey('base64url'));console.log('VAPID_PRIVATE_KEY='+c.getPrivateKey('base64url'))" >> "$GITHUB_ENV"

      - name: Start API and wait for health
        run: |
          cd apps/api
          node dist/main.js > /tmp/api.log 2>&1 &
          echo $! > /tmp/api.pid
          timeout 90 bash -c 'until curl -fs http://localhost:3001/health >/dev/null; do sleep 2; done' \
            || { echo "API did not become healthy"; cat /tmp/api.log; exit 1; }
          echo "API is healthy"

      # Playwright's webServer starts the production web server (`pnpm start`)
      # in CI; the API is already running above.
      - name: Run E2E tests
        run: pnpm --filter web exec playwright test --project=chromium

      - name: Stop API
        if: always()
        run: '[ -f /tmp/api.pid ] && kill "$(cat /tmp/api.pid)" || true'

      - name: Upload Playwright report
        if: always()
        continue-on-error: true # diagnostic artifact; storage-quota issues must not fail the gate
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 14

      - name: Upload test results (traces/screenshots)
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results
          path: apps/web/test-results/
          retention-days: 7

      - name: Comment PR with test results
        # Cosmetic PR comment — never let it fail the gate (e.g. when an earlier
        # step failed and no report was produced). v3 takes the JSON report file.
        if: ${{ always() && github.event_name == 'pull_request' }}
        continue-on-error: true
        uses: daun/playwright-report-comment@v4
        with:
          report-file: apps/web/test-results/results.json

  # Supplementary cross-browser coverage on main. Firefox/WebKit are not the
  # primary target and can surface engine-specific quirks, so this is reported
  # but does not block the pipeline (flip continue-on-error off to gate on it).
  e2e-cross-browser:
    name: E2E Tests (${{ matrix.browser }})
    runs-on: ubuntu-latest
    needs: scope
    if: ${{ needs.scope.outputs.run == 'true' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) }}
    timeout-minutes: 45
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cipansor_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: test-jwt-secret-key-for-e2e-testing
      # Production default is 15m; e2e pins 7d because global-setup logs each
      # role in ONCE and reuses the tokens for the whole (up to 40-min) run.
      JWT_EXPIRES_IN: 7d
      JWT_REFRESH_EXPIRES_IN: 30d
      CORS_ORIGIN: http://localhost:3000
      PORT: '3001'
      LOG_LEVEL: error
      TWO_FACTOR_RATE_LIMIT_MAX: '100000'
      ESIGN_RATE_LIMIT_MAX: '100000'
      NEXT_PUBLIC_API_URL: http://localhost:3001
      API_URL: http://localhost:3001/api
      BASE_URL: http://localhost:3000

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: cipansor_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright (${{ matrix.browser }})
        run: pnpm --filter web exec playwright install --with-deps ${{ matrix.browser }}

      - name: Generate Prisma client
        run: pnpm --filter api db:generate

      - name: Push database schema
        run: pnpm --filter api db:push

      - name: Seed database (with fixed-secret 2FA for admins)
        run: pnpm --filter api db:seed
        env:
          E2E_FIXED_2FA: '1'
          ALLOW_DESTRUCTIVE_SEED: '1'

      - name: Build shared + API + Web
        run: |
          pnpm --filter @cipansor/shared build
          pnpm --filter api build
          pnpm --filter web build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      # Web Push needs a VAPID key pair on the API, or the settings card reports
      # push unavailable and the subscribe/disable e2e cannot run. A pair made
      # for this job and thrown away with it — never a stored secret.
      - name: Generate a throwaway VAPID key pair
        run: |
          node -e "const c=require('crypto').createECDH('prime256v1');c.generateKeys();console.log('VAPID_PUBLIC_KEY='+c.getPublicKey('base64url'));console.log('VAPID_PRIVATE_KEY='+c.getPrivateKey('base64url'))" >> "$GITHUB_ENV"

      - name: Start API and wait for health
        run: |
          cd apps/api
          node dist/main.js > /tmp/api.log 2>&1 &
          echo $! > /tmp/api.pid
          timeout 90 bash -c 'until curl -fs http://localhost:3001/health >/dev/null; do sleep 2; done' \
            || { echo "API did not become healthy"; cat /tmp/api.log; exit 1; }

      # --max-failures: this job is informational, but a run that hits
      # timeout-minutes ends "cancelled", and a cancelled E2E run does not
      # trigger the staging deploy. On 2026-10-03 WebKit failed almost every
      # test (the CSP's upgrade-insecure-requests, #626); with three attempts
      # each it ran past 45 minutes and staging was never updated. Stopping
      # early keeps a broken engine a red, reported job instead.
      - name: Run E2E tests (${{ matrix.browser }})
        run: pnpm --filter web exec playwright test --project=${{ matrix.browser }} --max-failures=30

      - name: Stop API
        if: always()
        run: '[ -f /tmp/api.pid ] && kill "$(cat /tmp/api.pid)" || true'

      - name: Upload Playwright report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.browser }}
          path: apps/web/playwright-report/
          retention-days: 7
