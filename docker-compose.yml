# Docker Compose for Cipansor
# Development and Production configurations
#
# Resource limits are sized for a 2 vCPU / 8 GB host with no swap. The four
# services together reserve ~2 vCPU and ~3.9 GB, leaving headroom for the OS
# and nginx. Raise these together if the host is resized.

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: cipansor-db
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: cipansor
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Loopback-only: the API reaches this over the cipansor-network bridge.
    # Publishing on 0.0.0.0 exposes the database to the public internet.
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d cipansor"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 1G
    networks:
      - cipansor-network

  # API Service
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: cipansor-api
    restart: unless-stopped
    logging: *default-logging
    environment:
      # Deliberately NOT driven by .env's NODE_ENV=development. This API is
      # internet-facing, and outside production the error middleware returns
      # raw error.message to clients (middleware/error.ts). Flip this only for
      # a local, non-public stack.
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/cipansor
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-30d}
      STUDENT_CARD_HMAC_SECRET: ${STUDENT_CARD_HMAC_SECRET:-}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      # Enumerated here on purpose. A var present only in .env never reaches the
      # container, and the failure is silent — which is exactly how the old
      # APP_URL ended up unset in production while four call sites quietly used
      # their hardcoded fallbacks. The defaults below are the real hosts, so a
      # missing .env degrades to correct rather than to localhost.
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-https://cipansor.or.id}
      PORTAL_URL: ${PORTAL_URL:-https://portal.cipansor.or.id}
      PUBLIC_VERIFY_RATE_LIMIT_MAX: ${PUBLIC_VERIFY_RATE_LIMIT_MAX:-30}
      # Turnstile. Harus disebut namanya di sini: sebuah variabel yang ada di
      # .env tetapi tidak dienumerasi pada blok ini TIDAK PERNAH sampai ke
      # dalam kontainer, dan gerbangnya akan diam-diam mati sementara .env
      # tampak sudah benar. Kosong = gerbang mati (sah untuk pengembangan).
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      TURNSTILE_TIMEOUT_MS: ${TURNSTILE_TIMEOUT_MS:-4000}
      # Dienumerasikan meski biasanya kosong: sebuah variabel yang ada di .env
      # tapi tidak disebut di sini TIDAK PERNAH sampai ke kontainer, dan
      # tuas yang tidak tersambung lebih buruk daripada tuas yang tidak ada.
      TURNSTILE_ALLOWED_HOSTNAMES: ${TURNSTILE_ALLOWED_HOSTNAMES:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      # Web Push (VAPID). Both halves or neither: empty = push off and the
      # settings page says so. The web reads the public half from the API
      # (`GET /notifications/push/config`), so nothing is baked into the web image.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      # Staging switches (see config.scheduler / config.outboundMessages). ON for
      # this production stack; a staging copy sets both to false so it neither
      # runs the cron jobs nor sends e-mail/SMS/WhatsApp to real wali.
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-true}
      OUTBOUND_MESSAGES_ENABLED: ${OUTBOUND_MESSAGES_ENABLED:-true}
      DOCUMENT_TEST_COPY: ${DOCUMENT_TEST_COPY:-false}
      # Which deployed copy this is (`local`/`staging`/`production`). Distinct
      # from NODE_ENV, which is `production` for staging AND production because
      # both run the same images. Default `production` because this compose file
      # IS the production VM stack — a local run that wants to exercise the
      # chatbot with the `stub` provider sets APP_ENV=local explicitly, since the
      # stub is refused in production. A production build with it unset resolves
      # to `production` anyway (resolveAppEnv in config).
      APP_ENV: ${APP_ENV:-production}
      # Apply pending migrations at container start (docker-entrypoint.sh). Off
      # here: releases on this VM run `prisma migrate deploy` by hand after the
      # pre-checks in the deploy runbook. Azure App Service sets it to true.
      MIGRATE_ON_START: ${MIGRATE_ON_START:-false}
      # Public customer-service chatbot. This service enumerates its environment
      # explicitly, so a variable absent from this block does not reach the API
      # no matter what .env holds — which is how the assistant shipped inert.
      #
      # The default keeps that failure safe rather than silent: with no provider
      # the endpoint answers 503 and the widget does not render, instead of an
      # unconfigured model improvising about fees and admission dates.
      #
      # Only genuinely per-deployment values live here. The measured tuning
      # constants (timeout, max tokens, temperature, history depth, cache TTL)
      # keep their documented defaults in config/index.ts, where the reasoning
      # that produced the numbers sits next to them.
      CHATBOT_PROVIDER: ${CHATBOT_PROVIDER:-disabled}
      CHATBOT_API_BASE_URL: ${CHATBOT_API_BASE_URL:-}
      CHATBOT_API_KEY: ${CHATBOT_API_KEY:-}
      CHATBOT_MODEL: ${CHATBOT_MODEL:-}
      # Deployment-level house style. A persona saved by a super admin from
      # /settings/chatbot outranks this; see modules/chatbot/persona.service.ts.
      CHATBOT_PERSONA: ${CHATBOT_PERSONA:-}
      # An LLM behind a public page is a cost-amplification target, so the rate
      # limit is tunable without a rebuild.
      CHATBOT_RATE_LIMIT_WINDOW_MS: ${CHATBOT_RATE_LIMIT_WINDOW_MS:-60000}
      CHATBOT_RATE_LIMIT_MAX_REQUESTS: ${CHATBOT_RATE_LIMIT_MAX_REQUESTS:-10}
      # Harga token, anggaran bulanan dan tujuan peringatannya. Per-deployment
      # sepenuhnya: harganya milik model dan wilayah yang dipilih di atas, dan
      # anggarannya keputusan yayasan — tidak ada satu pun yang pantas menjadi
      # nilai bawaan di config/index.ts. Tanpa baris-baris ini, nilai di .env
      # tidak akan pernah sampai ke kontainer.
      CHATBOT_PRICE_INPUT_PER_MTOK: ${CHATBOT_PRICE_INPUT_PER_MTOK:-0}
      CHATBOT_PRICE_OUTPUT_PER_MTOK: ${CHATBOT_PRICE_OUTPUT_PER_MTOK:-0}
      CHATBOT_PRICE_CACHED_INPUT_PER_MTOK: ${CHATBOT_PRICE_CACHED_INPUT_PER_MTOK:-0}
      CHATBOT_PRICE_CURRENCY: ${CHATBOT_PRICE_CURRENCY:-USD}
      CHATBOT_MONTHLY_BUDGET: ${CHATBOT_MONTHLY_BUDGET:-0}
      CHATBOT_SPEND_ALERT_TO: ${CHATBOT_SPEND_ALERT_TO:-}
      # Outgoing mail identity, shared by every transport.
      #
      # NOTE THE ABSENCE OF QUOTES around the MAIL_FROM default. Compose does
      # not strip them: written as ${MAIL_FROM:-'"Name" <a@b>'} the container
      # receives the apostrophes as part of the value, and nodemailer parses the
      # display name as "' Name'". Verified with `docker compose config`.
      MAIL_FROM: ${MAIL_FROM:-Yayasan Pesantren Cipansor <noreply@cipansor.or.id>}
      MAIL_REPLY_TO: ${MAIL_REPLY_TO:-halo@cipansor.or.id}
      # Gmail API transport (preferred — no password anywhere).
      # A service account with domain-wide delegation, impersonating GMAIL_SENDER.
      # See docs/EMAIL_SETUP.md for how these three are produced.
      GOOGLE_SERVICE_ACCOUNT_EMAIL: ${GOOGLE_SERVICE_ACCOUNT_EMAIL:-}
      GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY: ${GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY:-}
      GMAIL_SENDER: ${GMAIL_SENDER:-noreply@cipansor.or.id}
      # SMTP fallback, used only when the Gmail credentials above are absent.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-noreply@cipansor.or.id}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_OAUTH_CLIENT_ID: ${SMTP_OAUTH_CLIENT_ID:-}
      SMTP_OAUTH_CLIENT_SECRET: ${SMTP_OAUTH_CLIENT_SECRET:-}
      SMTP_OAUTH_REFRESH_TOKEN: ${SMTP_OAUTH_REFRESH_TOKEN:-}
      # Cap on reset-link requests per 15 minutes, per IP.
      PASSWORD_RESET_RATE_LIMIT_MAX: ${PASSWORD_RESET_RATE_LIMIT_MAX:-5}
      # How long a KTP scan is kept after the key it justified expires. The
      # default matches the CA/Browser Forum's seven years and is what the code
      # falls back to; it is enumerated anyway, because a value the yayasan
      # lowers in .env and never reaches the container is the worst of both —
      # a shortened retention that was only ever shortened on paper.
      IDENTITY_DOCUMENT_RETENTION_YEARS: ${IDENTITY_DOCUMENT_RETENTION_YEARS:-7}
    volumes:
      # User uploads (santri photos, e-simaan recordings, attachments) are
      # written to public/uploads and served from /uploads. Without a volume
      # they sit on the container's writable layer and every redeploy deletes
      # them, leaving the database holding fileUrl rows that 404 forever.
      - api_uploads:/app/apps/api/public/uploads
      # Scans of KTP, kept as the registration evidence behind every signing
      # key. This one is not a convenience: the database records a retention
      # deadline seven years past the key's expiry and the verification note
      # says the document was seen, so a redeploy that silently deleted the
      # file would leave the system asserting an evidence trail it can no
      # longer produce. Separate from api_uploads because the two have
      # different rules — /uploads is served statically behind authentication,
      # this is served by nothing.
      - api_identity:/app/apps/api/private/identity
      # Clock-in selfies: facial images (UU PDP Ps. 4), served only by the
      # endpoint that checks the reader and records the read, and kept until
      # the attendance retention job removes them. Not under public/ for the
      # same reason as the KTP scans.
      - api_attendance:/app/apps/api/private/attendance
    ports:
      - "127.0.0.1:${API_PORT:-3001}:3001"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3001/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 1536M
    networks:
      - cipansor-network

  # Web Service
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # `-` not `:-` — an empty value is meaningful here (it makes the API
        # base relative), and `:-` would silently replace it with the default.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL-http://localhost:3001}
        # Site key Turnstile. Dibakar ke dalam bundel klien di sini dan hanya
        # di sini — menyuntingnya di .env produksi tidak berpengaruh sampai
        # image web dibangun ulang. Kosong = widget tidak dirender sama sekali,
        # yang berpasangan dengan TURNSTILE_SECRET_KEY kosong di sisi API.
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY-}
    container_name: cipansor-web
    restart: unless-stopped
    logging: *default-logging
    environment:
      # The runner stage ships a Next standalone production bundle, so this
      # stays production regardless of NODE_ENV elsewhere — the dev bundles
      # simply are not in the image.
      NODE_ENV: production
      PORT: 3000
      # Next standalone's server.js binds to $HOSTNAME. Docker sets that to the
      # container ID, so without this the server listens only on the container's
      # eth0 address and every loopback healthcheck fails.
      HOSTNAME: "0.0.0.0"
      # `:-` would replace an *empty* value with the default, not just an unset
      # one — and empty is the setting that makes the browser's API base
      # relative. `-` (no colon) substitutes only when the variable is unset, so
      # `NEXT_PUBLIC_API_URL=` in .env survives as the empty string it means to be.
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL-http://localhost:3001}
      # Server-side only: the verifikasi page is a server component and renders
      # inside this container, where a relative URL has nothing to resolve
      # against. Reaching the API over the compose network also keeps a QR scan
      # off the public internet — it used to leave the host and come back
      # through Cloudflare to read a row from our own database.
      #
      # This service enumerates its environment one variable at a time, so a
      # value present only in .env never reaches the container. Adding a
      # variable means editing both files.
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:3001}
    volumes:
      # next/image resizes on first request and caches the result here. Without
      # a volume that cache dies with every redeploy, so the next visitor — very
      # plausibly the Google Ad Grants reviewer — regenerates every image and
      # sees the landing page take ~7s instead of ~600ms.
      - web-image-cache:/app/apps/web/.next/cache/images
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 1G
    networks:
      - cipansor-network

  # Redis Cache (optional, for future scaling)
  redis:
    image: redis:7-alpine
    container_name: cipansor-redis
    restart: unless-stopped
    logging: *default-logging
    # Bounded memory so a runaway key set cannot OOM a swapless host.
    command: >
      redis-server --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    # Loopback-only. This instance has no requirepass set, so publishing it on
    # 0.0.0.0 left an unauthenticated Redis open to the internet.
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 384M
    networks:
      - cipansor-network

volumes:
  postgres_data:
  redis_data:
  # User uploads. Must outlive the container — see the api service's volumes.
  api_uploads:
  # KTP scans. Outlives the container for the same reason, and must be included
  # in any backup that claims to cover the signing keys' evidence trail.
  api_identity:
  # Clock-in selfies. Outlives the container; the retention job, not a
  # redeploy, decides when they go.
  api_attendance:
  # Survives redeploys so the optimised landing-page images stay warm.
  web-image-cache:

networks:
  cipansor-network:
    driver: bridge
